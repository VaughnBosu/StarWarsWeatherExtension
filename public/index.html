<!DOCTYPE html>
<head>
    <title>New Tab</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/public/index.css">
</head>
<body>
    <div class="hyperspace" id="background">
        <!-- app.js only creates the video after a weather-cache miss. -->
        <div id="test" class="video-wrapper" aria-hidden="true"></div>

        <section class="top">
            <p id="message"></p>
        </section>

        <div id="googleAppsLauncher" class="google-apps-launcher">
            <button type="button" id="googleAppsButton" class="google-apps-button" aria-haspopup="true" aria-expanded="false" aria-controls="googleAppsPanel">
                <svg class="google-apps-waffle" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="5" cy="5" r="1.6" fill="currentColor"/>
                    <circle cx="12" cy="5" r="1.6" fill="currentColor"/>
                    <circle cx="19" cy="5" r="1.6" fill="currentColor"/>
                    <circle cx="5" cy="12" r="1.6" fill="currentColor"/>
                    <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
                    <circle cx="19" cy="12" r="1.6" fill="currentColor"/>
                    <circle cx="5" cy="19" r="1.6" fill="currentColor"/>
                    <circle cx="12" cy="19" r="1.6" fill="currentColor"/>
                    <circle cx="19" cy="19" r="1.6" fill="currentColor"/>
                </svg>
            </button>
            <div id="googleAppsPanel" class="google-apps-panel hidden" role="menu"></div>
        </div>

        <div class="center-group">
            <section class="center">
                <div class="center1">
                    <p class="center1Text" id="center1Text"></p>
                </div>
                <div class="center2">
                    <div class="planet-heading">
                        <p class="planetText" id="planet"></p>
                    </div>
                    <p class="loading" id="loading"></p>
                </div>
                <div class="center3">
                    <p class="center3Text" id="center3Text"></p>
                </div>
            </section>

            <section class="newtab-extras">
                <form id="searchForm" class="search-form">
                    <input type="text" name="q" id="searchInput" class="search-input" autocomplete="off" autofocus>
                    <ul id="searchSuggestions" class="search-suggestions hidden" role="listbox"></ul>
                </form>
                <div id="shortcutsGrid" class="shortcuts-grid"></div>
            </section>
        </div>

        <section class="bottom">
            <div class="bottomText">
                <p id="description"></p>
            </div>
        </section>
        <section>
            <div class="footer">
                <p id="locationLabel" class="locationLabel"></p>
                <p id="LastUpdated"></p>
            </div>
        </section>

        <aside id="exploreMenu" class="explore-menu hidden">
            <button type="button" id="exploreMenuButton" class="explore-menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="exploreMenuPanel" aria-label="Explore" title="Explore">
                <svg class="explore-menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle class="explore-menu-orbit" cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="40.5 3.5" transform="rotate(-62 12 12)"/>
                    <circle cx="12" cy="12" r="1.9" fill="currentColor"/>
                </svg>
                <span class="explore-menu-button-label">Explore</span>
            </button>
            <div id="exploreMenuPanel" class="explore-menu-panel hidden" role="menu">
                <button type="button" id="exploreSettingsItem" class="explore-menu-item" role="menuitem">
                    <img class="explore-menu-item-icon" src="/public/assets/icons/ui/settings.svg" alt="" width="16" height="16" aria-hidden="true">
                    <span class="explore-menu-item-label">Settings</span>
                </button>
                <button type="button" id="exploreTourItem" class="explore-menu-item" role="menuitem">
                    <img class="explore-menu-item-icon" src="/public/assets/icons/ui/tour.svg" alt="" width="16" height="16" aria-hidden="true">
                    <span class="explore-menu-item-label">Tour the Galaxy</span>
                </button>
                <div class="explore-menu-separator" role="separator"></div>
                <button type="button" id="explorePassportItem" class="explore-menu-item" role="menuitem">
                    <img class="explore-menu-item-icon" src="/public/assets/icons/ui/passport.svg" alt="" width="16" height="16" aria-hidden="true">
                    <span class="explore-menu-item-label">Planet Passport</span>
                </button>
            </div>
        </aside>

        <aside id="passport" class="passport hidden" aria-label="Planet passport">
            <div id="passportPanel" class="passport-panel hidden" role="dialog" aria-modal="true" aria-labelledby="passportTitle">
                <div class="passport-dossier">
                    <div class="passport-panel-header">
                        <div class="passport-heading-row">
                            <div class="passport-heading">
                                <h2 id="passportTitle" class="passport-title">Planet Passport</h2>
                                <p id="passportCount" class="passport-count">0/10 worlds visited</p>
                            </div>
                            <button type="button" id="passportClose" class="passport-close" aria-label="Close">×</button>
                        </div>
                        <div class="passport-progress" aria-hidden="true">
                            <div id="passportProgressBar" class="passport-progress-bar"></div>
                        </div>
                    </div>
                    <ul id="passportGrid" class="passport-grid"></ul>
                    <p id="passportHint" class="passport-hint">Stamps unlock when local weather matches a world.</p>
                </div>
            </div>
        </aside>

        <script src="/src/vendor/browser-polyfill.min.js"></script>
        <script type="module" src="/src/env.js"></script>
        <script type="module" src="/src/app.js"></script>
        <script type="module" src="/src/newtab.js"></script>
        <script type="module" src="/src/search.js"></script>
    </div>
</body>
</html>
